name: Pruebas

on:
  push:
  pull_request:

jobs:
  api:
    name: API (Laravel + PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gimnasio_db_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: gimnasio-back
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_pgsql, pgsql, gd, zip
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - name: Estilo de código (Pint)
        run: vendor/bin/pint --test || echo "::warning::Pint encontró archivos con formato distinto a PSR-12"
      - name: Pruebas PHPUnit
        run: php artisan test

  ia:
    name: Microservicio de IA (Pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gimnasio-ia
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Pruebas Pytest
        run: python -m pytest -v
