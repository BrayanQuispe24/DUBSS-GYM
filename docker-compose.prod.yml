services:
  # ==========================================
  # 1. Base de Datos Relacional: PostgreSQL 16
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: dubss-postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_DATABASE:-gimnasio_db}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-6305913}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - dubss_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-gimnasio_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ==========================================
  # 2. Servidor de Caché y Colas: Redis 7
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: dubss-redis
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - dubss_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ==========================================
  # 3. Backend Core API: Laravel 11 / PHP 8.4
  # ==========================================
  backend:
    build:
      context: ./gimnasio-back
      dockerfile: Dockerfile
    container_name: dubss-backend
    restart: always
    env_file:
      - path: ./gimnasio-back/.env
        required: false
    environment:
      APP_NAME: "${APP_NAME:-DUBSS-GYM}"
      APP_ENV: "${APP_ENV:-production}"
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_URL: "${APP_URL:-https://gym.bratox.me}"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_CLIENT: predis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RUN_MIGRATIONS: "${RUN_MIGRATIONS:-true}"
    volumes:
      - laravel_storage:/var/www/html/storage
      - ./EJERCICIOS:/var/www/EJERCICIOS:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - dubss_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/ping"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ==========================================
  # 4. Microservicio de IA: FastAPI / Python 3.12
  # ==========================================
  ia-service:
    build:
      context: ./gimnasio-ia
      dockerfile: Dockerfile
    container_name: dubss-ia
    restart: always
    env_file:
      - path: ./gimnasio-ia/.env
        required: false
    environment:
      HOST: "0.0.0.0"
      PORT: 8001
      DEBUG: "false"
      REDIS_HOST: redis
      REDIS_PORT: 6379
    networks:
      - dubss_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ==========================================
  # 5. Frontend SPA: React 19 / Vite / Nginx
  # ==========================================
  frontend:
    build:
      context: ./gimnasio-front
      dockerfile: Dockerfile
      args:
        VITE_API_URL: "/api"
    container_name: dubss-frontend
    restart: always
    networks:
      - dubss_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ==========================================
  # 6. Gateway Perimetral: Nginx Reverse Proxy
  # ==========================================
  gateway:
    image: nginx:1.27-alpine
    container_name: dubss-gateway
    restart: always
    ports:
      - "${PORT:-8080}:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
      ia-service:
        condition: service_healthy
    networks:
      - dubss_network

volumes:
  postgres_data:
    name: dubss_postgres_data
  redis_data:
    name: dubss_redis_data
  laravel_storage:
    name: dubss_laravel_storage

networks:
  dubss_network:
    name: dubss_network
    driver: bridge
