# ========================================================
# DUBSS-GYM - Gateway de Producción (Reverse Proxy Nginx)
# ========================================================
server {
    listen 80;
    listen [::]:80;
    server_name localhost _;

    client_max_body_size 35M;

    # Compresión Gzip global
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Headers globales de proxy y seguridad
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;

    # 1. Microservicio de Inteligencia Artificial (FastAPI)
    location /api/v1/ia/ {
        proxy_pass http://ia-service:8001/api/v1/;
        proxy_read_timeout 180s;
        proxy_connect_timeout 60s;
    }

    # 2. Backend Core API (Laravel 11)
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_read_timeout 180s;
        proxy_connect_timeout 60s;
    }

    # 3. Almacenamiento público de archivos y comprobantes (Laravel Storage)
    location /storage/ {
        proxy_pass http://backend:8000/storage/;
        proxy_read_timeout 60s;
    }

    # 4. Frontend SPA (React 19 / Nginx)
    location / {
        proxy_pass http://frontend:80/;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

